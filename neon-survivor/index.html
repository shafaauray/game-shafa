<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Survivor</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060f; overflow: hidden; }
  canvas { display: block; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
// ===== Setup =====
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
addEventListener('resize', resize);
resize();

// ===== Input =====
const keys = {};
const mouse = { x: innerWidth / 2, y: innerHeight / 2, down: false };
addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key === ' ') e.preventDefault();
  if (state === 'menu' && e.key === 'Enter') startGame();
  if (state === 'over' && e.key.toLowerCase() === 'r') startGame();
  if (state === 'play' && e.key.toLowerCase() === 'p') paused = !paused;
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
canvas.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
canvas.addEventListener('mousedown', () => {
  mouse.down = true;
  if (state === 'menu') startGame();
});
addEventListener('mouseup', () => { mouse.down = false; });

// ===== Helpers =====
const rand = (a, b) => Math.random() * (b - a) + a;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

// ===== Game state =====
let state = 'menu';           // menu | play | over
let paused = false;
let player, bullets, enemies, particles, pickups;
let score, best = Number(localStorageGet('neonBest')) || 0;
let wave, waveTimer, spawnTimer, shootTimer, shake;

function localStorageGet(k) { try { return localStorage.getItem(k); } catch { return 0; } }
function localStorageSet(k, v) { try { localStorage.setItem(k, v); } catch {} }

function startGame() {
  player = { x: canvas.width / 2, y: canvas.height / 2, r: 14, speed: 4, hp: 100, inv: 0, power: 0 };
  bullets = []; enemies = []; particles = []; pickups = [];
  score = 0; wave = 1; waveTimer = 0; spawnTimer = 0; shootTimer = 0; shake = 0;
  paused = false;
  state = 'play';
}

// ===== Spawning =====
function spawnEnemy() {
  const side = Math.floor(rand(0, 4));
  const m = 40;
  let x, y;
  if (side === 0) { x = rand(0, canvas.width); y = -m; }
  else if (side === 1) { x = canvas.width + m; y = rand(0, canvas.height); }
  else if (side === 2) { x = rand(0, canvas.width); y = canvas.height + m; }
  else { x = -m; y = rand(0, canvas.height); }

  const roll = Math.random();
  let type;
  if (wave >= 3 && roll < 0.15) type = { kind: 'tank', r: 26, speed: 0.9, hp: 8, color: '#ff8a00', pts: 50 };
  else if (wave >= 2 && roll < 0.45) type = { kind: 'fast', r: 10, speed: 2.8, hp: 1, color: '#ffe600', pts: 20 };
  else type = { kind: 'basic', r: 15, speed: 1.6, hp: 2, color: '#ff2e88', pts: 10 };

  enemies.push({ x, y, ...type, maxHp: type.hp, speed: type.speed + wave * 0.08, angle: 0 });
}

function burst(x, y, color, count = 18, power = 5) {
  for (let i = 0; i < count; i++) {
    const a = rand(0, Math.PI * 2), s = rand(1, power);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(25, 50), max: 50, color, size: rand(1.5, 3.5) });
  }
}

// ===== Update =====
function update() {
  if (state !== 'play' || paused) return;

  // Player movement
  let dx = 0, dy = 0;
  if (keys['w'] || keys['arrowup']) dy -= 1;
  if (keys['s'] || keys['arrowdown']) dy += 1;
  if (keys['a'] || keys['arrowleft']) dx -= 1;
  if (keys['d'] || keys['arrowright']) dx += 1;
  if (dx || dy) {
    const len = Math.hypot(dx, dy);
    player.x += dx / len * player.speed;
    player.y += dy / len * player.speed;
    if (Math.random() < 0.5) particles.push({ x: player.x - dx * 12, y: player.y - dy * 12, vx: -dx, vy: -dy, life: 15, max: 15, color: '#00f0ff', size: 2 });
  }
  player.x = Math.max(player.r, Math.min(canvas.width - player.r, player.x));
  player.y = Math.max(player.r, Math.min(canvas.height - player.r, player.y));
  if (player.inv > 0) player.inv--;
  if (player.power > 0) player.power--;

  // Shooting
  shootTimer--;
  if ((mouse.down || keys[' ']) && shootTimer <= 0) {
    const a = Math.atan2(mouse.y - player.y, mouse.x - player.x);
    const spread = player.power > 0 ? [-0.2, 0, 0.2] : [0];
    for (const s of spread) {
      bullets.push({ x: player.x + Math.cos(a) * 18, y: player.y + Math.sin(a) * 18, vx: Math.cos(a + s) * 11, vy: Math.sin(a + s) * 11, life: 80 });
    }
    shootTimer = player.power > 0 ? 6 : 9;
  }

  // Bullets
  for (const b of bullets) { b.x += b.vx; b.y += b.vy; b.life--; }
  bullets = bullets.filter(b => b.life > 0 && b.x > -20 && b.x < canvas.width + 20 && b.y > -20 && b.y < canvas.height + 20);

  // Waves & spawning
  waveTimer++;
  if (waveTimer > 60 * 20) { wave++; waveTimer = 0; burst(canvas.width / 2, 80, '#00f0ff', 40, 8); }
  spawnTimer--;
  if (spawnTimer <= 0) {
    spawnEnemy();
    spawnTimer = Math.max(12, 55 - wave * 5);
  }

  // Enemies
  for (const e of enemies) {
    const a = Math.atan2(player.y - e.y, player.x - e.x);
    e.x += Math.cos(a) * e.speed;
    e.y += Math.sin(a) * e.speed;
    e.angle += 0.05;

    // Hit by bullet
    for (const b of bullets) {
      if (b.life > 0 && dist(b, e) < e.r + 4) {
        b.life = 0;
        e.hp--;
        burst(b.x, b.y, e.color, 5, 3);
      }
    }

    // Hit player
    if (dist(e, player) < e.r + player.r && player.inv <= 0) {
      player.hp -= e.kind === 'tank' ? 30 : 15;
      player.inv = 60;
      shake = 15;
      burst(player.x, player.y, '#00f0ff', 25, 6);
      e.hp = 0;
      e.noScore = true;
    }
  }

  // Dead enemies
  for (const e of enemies) {
    if (e.hp <= 0) {
      burst(e.x, e.y, e.color, e.kind === 'tank' ? 45 : 20, e.kind === 'tank' ? 8 : 5);
      if (!e.noScore) {
        score += e.pts;
        shake = Math.max(shake, e.kind === 'tank' ? 10 : 3);
        if (Math.random() < 0.08) pickups.push({ x: e.x, y: e.y, type: Math.random() < 0.5 ? 'hp' : 'power', life: 600 });
      }
    }
  }
  enemies = enemies.filter(e => e.hp > 0);

  // Pickups
  for (const p of pickups) {
    p.life--;
    if (dist(p, player) < player.r + 12) {
      if (p.type === 'hp') player.hp = Math.min(100, player.hp + 25);
      else player.power = 60 * 8;
      burst(p.x, p.y, p.type === 'hp' ? '#39ff14' : '#b84dff', 25, 5);
      p.life = 0;
    }
  }
  pickups = pickups.filter(p => p.life > 0);

  // Particles
  for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vx *= 0.95; p.vy *= 0.95; p.life--; }
  particles = particles.filter(p => p.life > 0);

  if (shake > 0) shake *= 0.85;

  // Game over
  if (player.hp <= 0) {
    burst(player.x, player.y, '#00f0ff', 80, 10);
    state = 'over';
    if (score > best) { best = score; localStorageSet('neonBest', best); }
  }
}

// ===== Draw =====
function glow(color, blur = 15) { ctx.shadowColor = color; ctx.shadowBlur = blur; }

function drawGrid() {
  ctx.strokeStyle = 'rgba(0, 240, 255, 0.06)';
  ctx.lineWidth = 1;
  const g = 50;
  for (let x = 0; x < canvas.width; x += g) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
  for (let y = 0; y < canvas.height; y += g) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }
}

function drawPolygon(x, y, r, sides, angle) {
  ctx.beginPath();
  for (let i = 0; i < sides; i++) {
    const a = angle + i / sides * Math.PI * 2;
    ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
  }
  ctx.closePath();
}

function text(str, x, y, size, color, align = 'center') {
  ctx.font = `bold ${size}px "Courier New", monospace`;
  ctx.textAlign = align;
  ctx.fillStyle = color;
  glow(color, 20);
  ctx.fillText(str, x, y);
}

function draw() {
  // Background with trail effect
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(5, 6, 15, 0.35)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  if (shake > 0.5) ctx.translate(rand(-shake, shake), rand(-shake, shake));
  drawGrid();

  if (state === 'menu') {
    ctx.restore();
    text('NEON SURVIVOR', canvas.width / 2, canvas.height / 2 - 60, 56, '#00f0ff');
    text('WASD / Panah: gerak   •   Mouse: bidik   •   Klik / Spasi: tembak', canvas.width / 2, canvas.height / 2 + 10, 16, '#ffffff');
    text('P: pause', canvas.width / 2, canvas.height / 2 + 40, 16, '#ffffff');
    text('Klik atau tekan ENTER untuk mulai', canvas.width / 2, canvas.height / 2 + 100, 22, '#ff2e88');
    if (best) text('Best: ' + best, canvas.width / 2, canvas.height / 2 + 140, 18, '#ffe600');
    return;
  }

  // Particles
  for (const p of particles) {
    ctx.globalAlpha = p.life / p.max;
    ctx.fillStyle = p.color;
    glow(p.color, 10);
    ctx.fillRect(p.x, p.y, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  // Pickups
  for (const p of pickups) {
    const c = p.type === 'hp' ? '#39ff14' : '#b84dff';
    const pulse = 10 + Math.sin(Date.now() / 150) * 3;
    if (p.life < 120 && Math.floor(p.life / 8) % 2) continue; // blink before vanishing
    ctx.strokeStyle = c; ctx.lineWidth = 3; glow(c, 20);
    if (p.type === 'hp') {
      ctx.beginPath();
      ctx.moveTo(p.x - pulse, p.y); ctx.lineTo(p.x + pulse, p.y);
      ctx.moveTo(p.x, p.y - pulse); ctx.lineTo(p.x, p.y + pulse);
      ctx.stroke();
    } else {
      drawPolygon(p.x, p.y, pulse, 3, Date.now() / 300);
      ctx.stroke();
    }
  }

  // Bullets
  ctx.fillStyle = '#ffffff';
  glow('#00f0ff', 15);
  for (const b of bullets) { ctx.beginPath(); ctx.arc(b.x, b.y, 3.5, 0, Math.PI * 2); ctx.fill(); }

  // Enemies
  for (const e of enemies) {
    ctx.strokeStyle = e.color; ctx.lineWidth = 3; glow(e.color, 20);
    const sides = e.kind === 'fast' ? 3 : e.kind === 'tank' ? 6 : 4;
    drawPolygon(e.x, e.y, e.r, sides, e.angle);
    ctx.stroke();
    if (e.kind === 'tank') {
      ctx.fillStyle = e.color;
      ctx.fillRect(e.x - e.r, e.y - e.r - 10, (e.hp / e.maxHp) * e.r * 2, 4);
    }
  }

  // Player
  if (state === 'play' && !(player.inv > 0 && Math.floor(player.inv / 5) % 2)) {
    const a = Math.atan2(mouse.y - player.y, mouse.x - player.x);
    const c = player.power > 0 ? '#b84dff' : '#00f0ff';
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(a);
    ctx.strokeStyle = c; ctx.lineWidth = 3; glow(c, 25);
    ctx.beginPath();
    ctx.moveTo(20, 0); ctx.lineTo(-12, -13); ctx.lineTo(-6, 0); ctx.lineTo(-12, 13);
    ctx.closePath();
    ctx.stroke();
    ctx.restore();
  }
  ctx.restore();

  // HUD
  ctx.shadowBlur = 0;
  text('SCORE ' + score, 20, 40, 24, '#ffffff', 'left');
  text('WAVE ' + wave, 20, 70, 18, '#00f0ff', 'left');
  text('BEST ' + best, canvas.width - 20, 40, 18, '#ffe600', 'right');

  // HP bar
  const bw = 220, bx = canvas.width / 2 - bw / 2, by = canvas.height - 40;
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 2;
  ctx.strokeRect(bx, by, bw, 14);
  const hpColor = player.hp > 50 ? '#39ff14' : player.hp > 25 ? '#ffe600' : '#ff2e88';
  ctx.fillStyle = hpColor; glow(hpColor, 15);
  ctx.fillRect(bx + 2, by + 2, Math.max(0, (player.hp / 100) * (bw - 4)), 10);
  if (player.power > 0) text('TRIPLE SHOT ' + Math.ceil(player.power / 60) + 's', canvas.width / 2, by - 12, 14, '#b84dff');

  if (paused) text('PAUSED', canvas.width / 2, canvas.height / 2, 48, '#ffffff');

  if (state === 'over') {
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(5, 6, 15, 0.6)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    text('GAME OVER', canvas.width / 2, canvas.height / 2 - 40, 60, '#ff2e88');
    text('Score: ' + score + '   •   Wave: ' + wave, canvas.width / 2, canvas.height / 2 + 15, 22, '#ffffff');
    if (score >= best && score > 0) text('REKOR BARU!', canvas.width / 2, canvas.height / 2 + 55, 22, '#ffe600');
    text('Tekan R untuk main lagi', canvas.width / 2, canvas.height / 2 + 100, 20, '#00f0ff');
  }
}

// ===== Loop =====
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
