// ---------- Layout ----------

  const oldLen = PATH ? PATH.len : 0;
  buildPath(LV);
  if (oldLen && balls.length) { const f = PATH.len / oldLen; for (const b of balls) b.s *= f; }

const N2L = (x, y) => portrait ? [y * LW, x * LH] : [x * LW, y * LH];

// ---------- Path ----------
function resample(raw) {
  const cum = [0]; for (let i = 1; i < raw.length; i++) cum.push(cum[i - 1] + Math.hypot(raw[i][0] - raw[i - 1][0], raw[i][1] - raw[i - 1][1]));

function buildPath(L) {
  const P = L.path, raw = [];

    const steps = 5000;
    for (let i = 0; i <= steps; i++) {
      const t = i / steps, a = P.a0 + t * P.turns * TAU, k = 1 - (1 - P.shrink) * t, w = 1 + (P.wob || 0) * Math.sin((P.n || 0) * a);

        for (let k = 1; k < 40; k++) { const t = k / 40, a = (1 - t) * (1 - t), b = 2 * (1 - t) * t, d = t * t; raw.push([a * p0[0] + b * c[0] + d * p1[0], a * p0[1] + b * c[1] + d * p1[1]]); }

}
function ptAt(s) {
  const n = PATH.len, ss = clamp(s, 0, n), i = Math.min(Math.floor(ss), n - 1), f = ss - i;

}
function tanAt(s) { const i = clamp(Math.floor(s), 0, PATH.len - 1); const dx = PATH.px[i + 1] - PATH.px[i], dy = PATH.py[i + 1] - PATH.py[i], l = Math.hypot(dx, dy) || 1; return [dx / l, dy / l]; }

function symbolPath(g, sym, s) {
  g.beginPath();

    case 'heart': g.moveTo(0, s * .55); g.bezierCurveTo(-s * 1.1, -s * .1, -s * .55, -s * .95, 0, -s * .35); g.bezierCurveTo(s * .55, -s * .95, s * 1.1, -s * .1, 0, s * .55); break;

function drawShooter() {

function drawHole() {
  const [x, y] = ptAt(PATH.len), r = 34 + danger * 8 + Math.sin(time * 6) * danger * 4;
  const g = ctx.createRadialGradient(x, y, 4, x, y, r * 2.2); g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(.35, danger > .1 ? `rgba(255,${80 - danger * 60},120,.75)` : 'rgba(160,80,255,.7)'); g.addColorStop(1, 'rgba(120,40,255,0)');

  ctx.save(); ctx.translate(x, y);
  for (let i = 0; i < 4; i++) { ctx.rotate(time * (1.2 + i * .3)); ctx.strokeStyle = `rgba(255,${180 - i * 30},${255 - i * 20},${.55 - i * .1})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(0, 0, r * (1 + i * .25), r * (.45 + i * .1), 0, 0, Math.PI * 1.3); ctx.stroke(); }

function drawPortal() {

function render() {

  ctx.strokeStyle = 'rgba(150,90,255,.22)'; ctx.lineWidth = D + 18; ctx.stroke(PATH.p2);
  ctx.strokeStyle = 'rgba(14,6,40,.85)'; ctx.lineWidth = D + 8; ctx.stroke(PATH.p2);
  ctx.strokeStyle = 'rgba(200,160,255,.35)'; ctx.lineWidth = 2; ctx.setLineDash([2, 14]); ctx.lineDashOffset = -time * 40; ctx.stroke(PATH.p2); ctx.setLineDash([]);
  // danger tint on the final stretch
  if (danger > 0) { ctx.strokeStyle = `rgba(255,60,120,${.12 + danger * .25})`; ctx.lineWidth = D + 8; ctx.beginPath(); const s0 = PATH.len * .8; let [x0, y0] = ptAt(s0); ctx.moveTo(x0, y0); for (let s = s0; s <= PATH.len; s += 4) { const [x, y] = ptAt(s); ctx.lineTo(x, y); } ctx.stroke(); }
  drawPortal(); drawHole();
  // aim guide
  if (state === 'play' && !paused && (aim.active || !isTouch)) {
    const [hx, hy, hit] = rayHit(1600), col = COLORS[shooter.cur].c;
    ctx.strokeStyle = col; ctx.globalAlpha = .55; ctx.lineWidth = 3; ctx.setLineDash([3, 11]); ctx.lineDashOffset = -time * 60;
    ctx.beginPath(); ctx.moveTo(shooter.x + Math.cos(shooter.ang) * 60, shooter.y + Math.sin(shooter.ang) * 60); ctx.lineTo(hx, hy); ctx.stroke(); ctx.setLineDash([]);
    if (hit) { ctx.beginPath(); ctx.arc(hx, hy, 8, 0, TAU); ctx.stroke(); }

    if (b.s > PATH.len - 30) sc = clamp((PATH.len - b.s) / 30, .05, 1);

// ---------- HUD ----------
const hc = {};
function updateHUD(force) {
  const set = (k, v, f) => { if (force || hc[k] !== v) { hc[k] = v; f(v); } };
  set('sc', score, v => $('score').textContent = v);
  set('lv', lives, v => $('lives').textContent = '💖'.repeat(Math.max(0, v)) + '🖤'.repeat(Math.max(0, 3 - v)));
  const left = spawnLeft + balls.length, pr = LV.count ? Math.round((1 - left / LV.count) * 100) : 0;
  set('pr', pr, v => { $('prog').style.width = v + '%'; $('progTxt').textContent = v + '% planet dihancurkan'; });
}
let toastTimer = 0;
function toast(text, color, sub) { const t = $('toast'); t.innerHTML = text + (sub ? '<small>' + sub + '</small>' : ''); t.style.color = color || '#fff'; t.classList.remove('show'); void t.offsetWidth; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1100); }

const show = (id, on) => $(id).classList.toggle('hidden', !on);
const isTouch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;

  : 'Gerakkan <b>mouse</b> buat membidik · <b>klik</b> buat menembak · <b>klik kanan</b> / <b>Spasi</b> buat tukar planet · <b>P</b> pause';
function buildLevelButtons() {

    return `<button class="lv${lock ? ' locked' : ''}" data-l="${i}"><b>${lock ? '🔒' : i + 1}</b>${L.name}<i>${lock ? '' : '⭐'.repeat(s) + '☆'.repeat(3 - s)}</i></button>`; }).join('');
  document.querySelectorAll('.lv').forEach(b => b.addEventListener('click', () => { const l = +b.dataset.l; if (l + 1 > unlocked) { toast('🔒 Selesaikan level ' + l + ' dulu'); return; } score = 0; startLevel(l); }));
}
buildLevelButtons();
const ICON_SOUND = '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M18.5 6a8.5 8.5 0 0 1 0 12" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
const ICON_MUTE = '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9l5 6M21 9l-5 6" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
const refreshMute = () => { $('btnMute').innerHTML = AU.muted ? ICON_MUTE : ICON_SOUND; }; refreshMute();
$('btnMute').addEventListener('click', () => { audioInit(); AU.muted = !AU.muted; store('gpMuted', AU.muted ? '1' : '0'); if (AU.master) AU.master.gain.value = AU.muted ? 0 : .7; refreshMute(); });
function toMenu() { state = 'menu'; paused = false; musicStop(); balls = []; shots = []; spawnLeft = 0; LV = LEVELS[0]; buildPath(LV);
  for (const id of ['win', 'over', 'pause', 'hud', 'swap', 'credit']) show(id, false); show('menu', true); buildLevelButtons(); }
function setPause(p) { if (state !== 'play') return; paused = p; show('pause', p); if (p) musicStop(); else { audioInit(); musicStart(); } }
$('btnPause').addEventListener('click', () => setPause(true)); $('btnResume').addEventListener('click', () => setPause(false));
$('btnPauseMenu').addEventListener('click', toMenu); $('btnMenu').addEventListener('click', toMenu); $('btnMenu2').addEventListener('click', toMenu);
$('btnRetry').addEventListener('click', () => { score = 0; startLevel(levelIdx); });

// ---------- Input ----------
const toL = (cx, cy) => [(cx - OX) / K, (cy - OY) / K];
